name: Deploy

# This workflow is disabled by default.
# Uncomment the trigger you want to use for deployment.

on:
  # Trigger on push to main branch
  # push:
  #   branches: [ main ]

  # Trigger on new release/tag
  # release:
  #   types: [published]

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        script: |
          cd /path/to/WooOdooConnector
          git pull origin main
          docker-compose pull
          docker-compose up -d --build
          docker-compose exec -T connector python -c "print('Deployment successful')"

    # Alternative: Deploy to Docker Swarm
