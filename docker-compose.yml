version: '3.8'

services:
  # WooCommerce-Odoo Connector API
  connector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: woo-odoo-connector
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # WooCommerce
      - WOO_URL=${WOO_URL}
      - WOO_CONSUMER_KEY=${WOO_CONSUMER_KEY}
      - WOO_CONSUMER_SECRET=${WOO_CONSUMER_SECRET}

      # Odoo
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USERNAME=${ODOO_USERNAME}
      - ODOO_PASSWORD=${ODOO_PASSWORD}

      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_SECRET_KEY=${API_SECRET_KEY}

      # Sync
      - SYNC_ENABLED=${SYNC_ENABLED:-true}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      - ./logs:/app/logs
      - ./src:/app/src  # For development - remove in production

    restart: unless-stopped

    networks:
      - connector-network

  # Optional: Scheduler for automatic syncs
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile
  #   container_name: woo-odoo-scheduler
  #   command: python -m connector.scheduler
  #   environment:
  #     # Same environment as connector
  #   depends_on:
  #     - connector
  #   restart: unless-stopped
  #   networks:
  #     - connector-network

networks:
  connector-network:
    driver: bridge
